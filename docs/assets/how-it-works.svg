<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">How Keepword works</title>
  <desc id="d">1. Witnesses in different countries visit the same page. 2. Each one seals what it saw, with a tamper-proof time stamp. 3. They compare notes and flag differences and silent edits. 4. Anyone can check the proof, without trusting anyone.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b7bff"/>
    </marker>
  </defs>
  <rect width="1200" height="330" rx="22" fill="#f7f6ff"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="22" fill="none" stroke="#e2dffb"/>

  <g stroke="#8b7bff" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M262 118 H318"/>
    <path d="M562 118 H618"/>
    <path d="M862 118 H918"/>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 1. visit -->
    <g transform="translate(150 118)">
      <circle r="58" fill="#ebe8ff"/>
      <circle r="30" fill="none" stroke="#5b4be0" stroke-width="3"/>
      <ellipse rx="13" ry="30" fill="none" stroke="#5b4be0" stroke-width="2.5"/>
      <path d="M-30 0 H30 M-26 -14 H26 M-26 14 H26" stroke="#5b4be0" stroke-width="2.5"/>
      <circle cx="-44" cy="-30" r="7" fill="#ffb020"/>
      <circle cx="46" cy="-24" r="7" fill="#ffb020"/>
      <circle cx="40" cy="38" r="7" fill="#ffb020"/>
      <circle cx="-42" cy="34" r="7" fill="#ffb020"/>
    </g>
    <text x="150" y="222" font-size="20" font-weight="700" fill="#1b1f33">Many witnesses look</text>
    <text x="150" y="252" font-size="15" fill="#555a70">Computers in different</text>
    <text x="150" y="274" font-size="15" fill="#555a70">countries and networks visit</text>
    <text x="150" y="296" font-size="15" fill="#555a70">the same page.</text>

    <!-- 2. seal -->
    <g transform="translate(450 118)">
      <circle r="58" fill="#ebe8ff"/>
      <rect x="-24" y="-32" width="48" height="60" rx="5" fill="#ffffff" stroke="#5b4be0" stroke-width="3"/>
      <path d="M-14 -18 H14 M-14 -8 H14 M-14 2 H6" stroke="#b9b3ef" stroke-width="3"/>
      <circle cx="16" cy="24" r="17" fill="#ffb020"/>
      <path d="M8 24 l6 6 l10 -12" fill="none" stroke="#4a2c00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="450" y="222" font-size="20" font-weight="700" fill="#1b1f33">Each one seals it</text>
    <text x="450" y="252" font-size="15" fill="#555a70">A digital signature and a</text>
    <text x="450" y="274" font-size="15" fill="#555a70">time stamp nobody can fake,</text>
    <text x="450" y="296" font-size="15" fill="#555a70">not even the witness itself.</text>

    <!-- 3. compare -->
    <g transform="translate(750 118)">
      <circle r="58" fill="#ebe8ff"/>
      <path d="M0 -34 V30 M-26 -22 H26" stroke="#5b4be0" stroke-width="3" stroke-linecap="round"/>
      <path d="M-26 -22 L-38 6 H-14 Z M26 -22 L14 6 H38 Z" fill="#ffffff" stroke="#5b4be0" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-14 30 H14" stroke="#5b4be0" stroke-width="4" stroke-linecap="round"/>
      <circle cx="38" cy="-36" r="12" fill="#f03e3e"/>
      <text x="38" y="-30.5" font-size="16" font-weight="800" fill="#ffffff">!</text>
    </g>
    <text x="750" y="222" font-size="20" font-weight="700" fill="#1b1f33">They compare notes</text>
    <text x="750" y="252" font-size="15" fill="#555a70">Quiet edits, or a site that</text>
    <text x="750" y="274" font-size="15" fill="#555a70">shows different people different</text>
    <text x="750" y="296" font-size="15" fill="#555a70">things, get flagged.</text>

    <!-- 4. verify -->
    <g transform="translate(1050 118)">
      <circle r="58" fill="#ebe8ff"/>
      <rect x="-26" y="-32" width="42" height="54" rx="5" fill="#ffffff" stroke="#5b4be0" stroke-width="3"/>
      <path d="M-17 -18 H7 M-17 -8 H7 M-17 2 H0" stroke="#b9b3ef" stroke-width="3"/>
      <circle cx="12" cy="12" r="17" fill="#ffffff" fill-opacity="0.85" stroke="#5b4be0" stroke-width="3.5"/>
      <path d="M24 24 L38 38" stroke="#5b4be0" stroke-width="6" stroke-linecap="round"/>
      <path d="M4 12 l6 6 l10 -12" fill="none" stroke="#2b8a3e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1050" y="222" font-size="20" font-weight="700" fill="#1b1f33">Anyone can check</text>
    <text x="1050" y="252" font-size="15" fill="#555a70">The proof is a small file.</text>
    <text x="1050" y="274" font-size="15" fill="#555a70">It checks out on any computer,</text>
    <text x="1050" y="296" font-size="15" fill="#555a70">no trust in anyone needed.</text>
  </g>
</svg>

    </g>

    <!-- words -->
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="74" y="226" font-size="30" font-weight="600" fill="#e8e5ff">Web pages change quietly.</text>
      <text x="74" y="266" font-size="30" font-weight="600" fill="#ffcf5c">Now there's proof of what they said.</text>
      <text x="74" y="322" font-size="18" fill="#b9b6d9">Independent witnesses around the world record web pages,</text>
      <text x="74" y="348" font-size="18" fill="#b9b6d9">seal what they saw with cryptography, and catch every</text>
      <text x="74" y="374" font-size="18" fill="#b9b6d9">silent edit. Anyone can check the proof.</text>
    </g>
  </g>

  <text x="640" y="600" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#c3bdf2">Independent · Tamper-evident · <tspan fill="#ffcf5c">Verifiable by anyone</tspan></text>
</svg>

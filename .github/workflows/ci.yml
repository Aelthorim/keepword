name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace
      - run: cargo build --workspace --features keepword-node/render

  # The TLSNotary tier is its own workspace (large git dependencies, Rust
  # 1.95+). Release mode: MPC-TLS is slow unoptimized.
  tlsn:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/keepword-tlsn
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/keepword-tlsn
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets
      - run: cargo test --release

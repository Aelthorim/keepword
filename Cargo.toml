[workspace]
resolver = "3"
members = [
    "crates/keepword-core",
    "crates/keepword-normalize",
    "crates/keepword-capture",
    "crates/keepword-store",
    "crates/keepword-node",
]
# Its own workspace; see crates/keepword-tlsn/Cargo.toml.
exclude = ["crates/keepword-tlsn"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/keepword-net/keepword"

[workspace.dependencies]
keepword-core = { path = "crates/keepword-core" }
keepword-normalize = { path = "crates/keepword-normalize" }
keepword-capture = { path = "crates/keepword-capture" }
keepword-store = { path = "crates/keepword-store" }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
encoding_rs = "0.8"
getrandom = "0.3"
hex = "0.4"
humantime = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }

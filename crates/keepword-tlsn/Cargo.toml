[package]
name = "keepword-tlsn"
description = "TLSNotary proof tier for Keepword: a second witness notarizes the TLS session of a capture"
version = "2.1.0"
edition = "2024"
# tlsn requires a recent toolchain.
rust-version = "1.95"
# Not on crates.io: tlsn is only available from git.
publish = false
license = "AGPL-3.0-only"

# A separate workspace: tlsn pulls in a large MPC stack from git, which the
# main workspace should not have to fetch or build.
[workspace]

[[bin]]
name = "keepword-tlsn"
path = "src/main.rs"

[dependencies]
keepword-core = { path = "../keepword-core" }
keepword-capture = { path = "../keepword-capture" }
keepword = { path = "../keepword" }

tlsn = { git = "https://github.com/tlsnotary/tlsn", rev = "2d7a627b024f8acaa0438a9ffe925f58910391de", features = ["mozilla-certs"] }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
url = "2"

[dev-dependencies]
tempfile = "3"
# Paused time, for the timeout tests.
tokio = { version = "1", features = ["test-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tlsn-server-fixture-certs = { git = "https://github.com/tlsnotary/tlsn", rev = "2d7a627b024f8acaa0438a9ffe925f58910391de" }

[package]
name = "keepword-capture"
description = "Fetching pages as evidence: raw HTTP with TLS details, optional headless rendering, WARC export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Headless-browser capture for JS-rendered pages. Pulls in chromiumoxide.
render = ["dep:chromiumoxide", "dep:futures"]

[dependencies]
keepword-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
